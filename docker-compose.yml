version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: wtforge-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: wtforge
      POSTGRES_USER: wtforge
      POSTGRES_PASSWORD: wtforge
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=1310kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtforge -d wtforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wtforge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.image
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgresql://wtforge:wtforge@postgres:5432/wtforge?schema=public"
    # Uncomment to mount extra config/data if needed
    # volumes:
    #   - ./docker/seed:/app/docker/seed:ro

volumes:
  postgres_data:
