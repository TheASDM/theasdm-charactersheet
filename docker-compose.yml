version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: dnd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dnd_character_sheet}
      POSTGRES_USER: ${POSTGRES_USER:-dnd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
    ports:
      - '5432:5432'
    networks:
      - dnd-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dnd_user}']
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dnd-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dnd_user}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-dnd_character_sheet}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PORT: 3001
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    ports:
      - '3001:3001'
    depends_on:
      database:
        condition: service_healthy
    networks:
      - dnd-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dnd-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${BACKEND_URL:-http://localhost:3001}/api
      REACT_APP_SOCKET_URL: ${BACKEND_URL:-http://localhost:3001}
    ports:
      - '3000:80'
    depends_on:
      - backend
    networks:
      - dnd-network

  # Discord Bot
  discord-bot:
    build:
      context: ./discord-bot
      dockerfile: Dockerfile
    container_name: dnd-discord-bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      API_BASE_URL: http://backend:3001/api
      DATABASE_URL: postgresql://${POSTGRES_USER:-dnd_user}:${POSTGRES_PASSWORD:-password}@database:5432/${POSTGRES_DB:-dnd_character_sheet}
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - dnd-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dnd-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - frontend
      - backend
    networks:
      - dnd-network

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: dnd-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - dnd-network
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN_NAME}

volumes:
  postgres_data:
  certbot_data:
  certbot_www:

networks:
  dnd-network:
    driver: bridge
